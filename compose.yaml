x-app: &app
  build:
    context: .
    target: runtime
  env_file: .env
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbit:
    image: rabbitmq:4
    hostname: rabbit
    environment:
      RABBITMQ_DEFAULT_USER: monitor
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "64mb",
              "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  demo:
    <<: *app
    command: ["python", "demo.py"]

  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-l", "INFO", "--concurrency=2"]
    depends_on:
      db:
        condition: service_healthy
      rabbit:
        condition: service_healthy
      demo:
        condition: service_started

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "-l", "INFO",
              "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      rabbit:
        condition: service_healthy

  test:
    build:
      context: .
      target: test
    env_file: .env
    environment:
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  rabbitdata: